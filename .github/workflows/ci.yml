name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: make install-js
      - run: make test-js

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Graphviz (`dot`) is only needed for `make visualize`, which CI does not run.
      - run: make install-python
      - run: make test-python

  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-cpp
